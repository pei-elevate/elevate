[project]
name = "elevate-api"
version = "0.1.0"
description = "Backend do Elevate (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"
