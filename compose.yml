name: elevate

services:
  proxy:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./app/frontend
    volumes:
      - ./app/frontend:/app
      - /app/node_modules

  backend:
    build: ./app/backend
    command: sh -c "alembic upgrade head && fastapi dev api/main.py --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-elevate}:${POSTGRES_PASSWORD:-elevate}@db:5432/${POSTGRES_DB:-elevate}
    volumes:
      - ./app/backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elevate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elevate}
      POSTGRES_DB: ${POSTGRES_DB:-elevate}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-db:
    profiles: [auth]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik}
      POSTGRES_DB: authentik
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-server:
    profiles: [auth]
    image: ghcr.io/goauthentik/server:2026.8.5
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-in-your-env-file}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik}
    ports:
      - "9000:9000"
    volumes:
      - authentik-data:/data
    depends_on:
      authentik-db:
        condition: service_healthy

  authentik-worker:
    profiles: [auth]
    image: ghcr.io/goauthentik/server:2026.8.5
    command: worker
    environment: *authentik-env
    volumes:
      - authentik-data:/data
    depends_on:
      authentik-db:
        condition: service_healthy

volumes:
  db-data:
  authentik-db-data:
  authentik-data:
